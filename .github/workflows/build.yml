name: Build Waqtak
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip newest project zip
        run: |
          ZIP=$(git -c core.quotepath=false log -1 --name-only --diff-filter=AM --format= -- '*.zip' | head -n 1)
          echo "Building from: $ZIP"
          unzip -q -o "$ZIP"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: Waqtak
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Build AAB
        working-directory: Waqtak
        run: gradle bundleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Waqtak-APK
          path: Waqtak/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Waqtak-AAB
          path: Waqtak/app/build/outputs/bundle/release/*.aab
